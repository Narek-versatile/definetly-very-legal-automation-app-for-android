name: Desktop (Python)

on:
  push:
    branches:
      - claude/android-automation-app-pwxptp
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-python.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-python.yml"
  workflow_dispatch:

concurrency:
  group: desktop-python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop/python

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      # --with-deps installs Linux apt libs; on Windows it is a no-op that has
      # intermittently hung, so only pass it on Linux.
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Unit tests
        run: python -m pytest -q

      - name: End-to-end self-test against local form (headless)
        shell: bash
        run: |
          python -m http.server 8123 --directory ../testpages &
          SERVER_PID=$!
          sleep 2
          python -m autoflow.cli run ../automations/_selftest.json \
            --var baseurl=http://127.0.0.1:8123 --var username=CiTester --headless
          kill $SERVER_PID

  package:
    name: Package Windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + PyInstaller
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build single-file exe
        run: pyinstaller --onefile --name autoflow --collect-all playwright autoflow/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: autoflow-python-win
          path: desktop/python/dist/autoflow.exe
          if-no-files-found: error
